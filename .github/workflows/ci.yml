name: CI

on:
  push:
    branches: [main, master]
    tags: ["v*"]
  pull_request:
    branches: [main, master]

permissions:
  contents: read
  packages: write

env:
  NODE_VERSION: "22"
  REGISTRY: ghcr.io

jobs:
  test:
    name: Typecheck and unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test

  e2e:
    name: Playwright E2E (Compose)
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Prepare .env
        run: |
          cp .env.example .env
          # Stable secrets for E2E (match e2e defaults / .env.example)
          sed -i 's/^BLINK_PASSWORD=.*/BLINK_PASSWORD=changeme/' .env
          sed -i 's/^BLINK_API_KEY=.*/BLINK_API_KEY=changeme-api-key/' .env
          sed -i 's/^BLINK_SESSION_SECRET=.*/BLINK_SESSION_SECRET=ci-e2e-session-secret/' .env
      - name: Start Compose
        run: docker compose up -d --build
      - name: Wait for API ready
        run: |
          for i in $(seq 1 60); do
            if curl -sf http://localhost/api/ready >/dev/null; then
              echo "ready"
              exit 0
            fi
            sleep 2
          done
          echo "API not ready" >&2
          docker compose logs
          exit 1
      - name: Run E2E
        env:
          BLINK_PASSWORD: changeme
          BLINK_API_KEY: changeme-api-key
          BLINK_E2E_BASE_URL: http://localhost
        run: npm run test:e2e
      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
      - name: Compose logs on failure
        if: failure()
        run: docker compose logs
      - name: Tear down
        if: always()
        run: docker compose down -v

  publish:
    name: Publish GHCR images
    runs-on: ubuntu-latest
    needs: [test, e2e]
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - uses: actions/checkout@v4
      - name: Image name prefix
        id: meta
        run: |
          owner="$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')"
          echo "owner=$owner" >> "$GITHUB_OUTPUT"
          echo "tag=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push API
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/api/Dockerfile
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ steps.meta.outputs.owner }}/blink-api:${{ steps.meta.outputs.tag }}
            ${{ env.REGISTRY }}/${{ steps.meta.outputs.owner }}/blink-api:latest
          labels: |
            org.opencontainers.image.title=Blink API
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
      - name: Build and push Web
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/web/Dockerfile
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ steps.meta.outputs.owner }}/blink-web:${{ steps.meta.outputs.tag }}
            ${{ env.REGISTRY }}/${{ steps.meta.outputs.owner }}/blink-web:latest
          labels: |
            org.opencontainers.image.title=Blink Web
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
