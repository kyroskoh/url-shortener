# Host nginx vhost for Blink / layurl.com (Compose nginx is not used in prod).
#
# Installed as: zz-blink-layurl.com.conf
# Placeholders __BLINK_SSL_CERT__ / __BLINK_SSL_KEY__ are filled by
# deploy/scripts/install-host-nginx.sh (Cloudflare Full strict needs origin TLS).
#
# Proxies to Compose localhost ports (docker-compose.prod.yml).

upstream blink_layurl_api {
  server 127.0.0.1:3000;
  keepalive 16;
}

upstream blink_layurl_web {
  server 127.0.0.1:8080;
  keepalive 8;
}

server {
  listen 80;
  listen [::]:80;
  listen 443 ssl;
  listen [::]:443 ssl;
  server_name layurl.com www.layurl.com;

  # __BLINK_SSL_BEGIN__
  ssl_certificate     __BLINK_SSL_CERT__;
  ssl_certificate_key __BLINK_SSL_KEY__;
  ssl_session_timeout 1d;
  ssl_session_cache shared:BlinkLayurlSSL:10m;
  ssl_protocols TLSv1.2 TLSv1.3;
  # __BLINK_SSL_END__

  client_max_body_size 2m;

  # Cloudflare / proxy real IP (optional; tighten set_real_ip_from to CF ranges in prod)
  real_ip_header CF-Connecting-IP;
  set_real_ip_from 0.0.0.0/0;
  real_ip_recursive on;

  location = / {
    proxy_pass http://blink_layurl_api/site-home;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header CF-Connecting-IP $http_cf_connecting_ip;
  }

  location /api/ {
    proxy_pass http://blink_layurl_api/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header CF-Connecting-IP $http_cf_connecting_ip;
  }

  location /admin/ {
    rewrite ^/admin/?(.*)$ /$1 break;
    proxy_pass http://blink_layurl_web;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  location = /admin {
    return 302 /admin/;
  }

  location ~ ^/([A-Za-z0-9_-]+)$ {
    proxy_pass http://blink_layurl_api/r/$1;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header CF-Connecting-IP $http_cf_connecting_ip;
  }

  location / {
    proxy_pass http://blink_layurl_web;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }
}
