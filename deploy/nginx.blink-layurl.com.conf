# Host nginx vhost for Blink / layurl.com (Compose nginx is not used in prod).
#
# Installed as a uniquely named site file so it does not collide with generic
# names in conf.d (e.g. default.conf). Destination basename:
#   zz-blink-layurl.com.conf
#
# Manual install (Debian/Ubuntu sites-*):
#   sudo cp deploy/nginx.blink-layurl.com.conf /etc/nginx/sites-available/zz-blink-layurl.com.conf
#   sudo ln -sfn /etc/nginx/sites-available/zz-blink-layurl.com.conf /etc/nginx/sites-enabled/zz-blink-layurl.com.conf
#   sudo nginx -t && sudo systemctl reload nginx
#
# Or conf.d:
#   sudo cp deploy/nginx.blink-layurl.com.conf /etc/nginx/conf.d/zz-blink-layurl.com.conf
#   sudo nginx -t && sudo systemctl reload nginx
#
# Proxies to Compose localhost ports (docker-compose.prod.yml).

upstream blink_layurl_api {
  server 127.0.0.1:3000;
  keepalive 16;
}

upstream blink_layurl_web {
  server 127.0.0.1:8080;
  keepalive 8;
}

server {
  listen 80;
  listen [::]:80;
  server_name layurl.com www.layurl.com;

  client_max_body_size 2m;

  # Cloudflare / proxy real IP (optional; tighten set_real_ip_from to CF ranges in prod)
  real_ip_header CF-Connecting-IP;
  set_real_ip_from 0.0.0.0/0;
  real_ip_recursive on;

  location = / {
    proxy_pass http://blink_layurl_api/site-home;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header CF-Connecting-IP $http_cf_connecting_ip;
  }

  location /api/ {
    proxy_pass http://blink_layurl_api/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header CF-Connecting-IP $http_cf_connecting_ip;
  }

  location /admin/ {
    rewrite ^/admin/?(.*)$ /$1 break;
    proxy_pass http://blink_layurl_web;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  location = /admin {
    return 302 /admin/;
  }

  location ~ ^/([A-Za-z0-9_-]+)$ {
    proxy_pass http://blink_layurl_api/r/$1;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header CF-Connecting-IP $http_cf_connecting_ip;
  }

  location / {
    proxy_pass http://blink_layurl_web;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }
}
