worker_processes auto;

events {
  worker_connections 1024;
}

http {
  include       /etc/nginx/mime.types;
  default_type  application/octet-stream;
  sendfile      on;
  keepalive_timeout 65;

  # Trust Cloudflare / proxy headers
  real_ip_header CF-Connecting-IP;
  set_real_ip_from 0.0.0.0/0;
  real_ip_recursive on;

  upstream blink_api {
    server api:3000;
  }

  upstream blink_web {
    server web:80;
  }

  server {
    listen 80;
    server_name _;

    client_max_body_size 2m;

    location = / {
      proxy_pass http://blink_api/site-home;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_set_header CF-Connecting-IP $http_cf_connecting_ip;
    }

    location /api/ {
      proxy_pass http://blink_api/;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_set_header CF-Connecting-IP $http_cf_connecting_ip;
    }

    # Admin UI (Vite base /admin/)
    location /admin/ {
      rewrite ^/admin/?(.*)$ /$1 break;
      proxy_pass http://blink_web;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = /admin {
      return 302 /admin/;
    }

    # Short-link redirects: single path segment, not reserved UI assets
    location ~ ^/([A-Za-z0-9_-]+)$ {
      proxy_pass http://blink_api/r/$1;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_set_header CF-Connecting-IP $http_cf_connecting_ip;
    }

    location / {
      proxy_pass http://blink_web;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
    }
  }
}
