# Host nginx site for Blink when the edge is already on the server
# (do not use the Compose nginx service).
#
# Install (Debian/Ubuntu sites-*):
#   sudo cp deploy/nginx.host.conf /etc/nginx/sites-available/blink-layurl.conf
#   sudo ln -sfn /etc/nginx/sites-available/blink-layurl.conf /etc/nginx/sites-enabled/blink-layurl.conf
#   sudo nginx -t && sudo systemctl reload nginx
#
# Or conf.d style:
#   sudo cp deploy/nginx.host.conf /etc/nginx/conf.d/blink-layurl.conf
#   sudo nginx -t && sudo systemctl reload nginx
#
# Proxies to Compose-published localhost ports (see docker-compose.prod.yml).

upstream blink_api {
  server 127.0.0.1:3000;
  keepalive 16;
}

upstream blink_web {
  server 127.0.0.1:8080;
  keepalive 8;
}

server {
  listen 80;
  listen [::]:80;
  server_name layurl.com www.layurl.com;

  client_max_body_size 2m;

  # Cloudflare / proxy real IP (optional; tighten set_real_ip_from to CF ranges in prod)
  real_ip_header CF-Connecting-IP;
  set_real_ip_from 0.0.0.0/0;
  real_ip_recursive on;

  location = / {
    proxy_pass http://blink_api/site-home;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header CF-Connecting-IP $http_cf_connecting_ip;
  }

  location /api/ {
    proxy_pass http://blink_api/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header CF-Connecting-IP $http_cf_connecting_ip;
  }

  location /admin/ {
    rewrite ^/admin/?(.*)$ /$1 break;
    proxy_pass http://blink_web;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  location = /admin {
    return 302 /admin/;
  }

  location ~ ^/([A-Za-z0-9_-]+)$ {
    proxy_pass http://blink_api/r/$1;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header CF-Connecting-IP $http_cf_connecting_ip;
  }

  location / {
    proxy_pass http://blink_web;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }
}
